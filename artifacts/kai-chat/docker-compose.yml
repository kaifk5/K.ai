# Roda tudo (banco MongoDB + site + API) com um comando:  docker compose up --build
# Depois abra http://localhost:8001
services:
  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
  app:
    build: .
    ports:
      - "8001:8001"
    env_file:
      - backend/.env
    environment:
      MONGO_URL: "mongodb://mongo:27017"
      CORS_ORIGINS: "http://localhost:8001"
      PORT: "8001"
    depends_on:
      - mongo
volumes:
  mongo_data:
