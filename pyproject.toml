[project]
name = "repl-nix-workspace"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Kaiquealvescastro2012 Alves", email = "67135116-kaiquealvescast@users.noreply.replit.com" }
]
requires-python = ">=3.11"
dependencies = [
    "bcrypt==4.1.3",
    "email-validator>=2.2.0",
    "fastapi==0.110.1",
    "motor==3.7.1",
    "pydantic>=2.6.4",
    "pyjwt>=2.10.1",
    "pymongo==4.18.2",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.9",
    "requests>=2.31.0",
    "tzdata>=2024.2",
    "uvicorn==0.25.0",
]

[project.scripts]
repl-nix-workspace = "repl_nix_workspace:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
